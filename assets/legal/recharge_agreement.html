  <h1>用户充值协议</h1>
  <p class="note">本地 1.0 测试版协议。正式发布前，运营主体、联系方式和生效日期须与 App Store 信息一致。</p>
  <h2>1. 充值与价格</h2>
  <p>实际商品价格、币种和结算以 Apple 购买面板为准。请在确认商品、数量和价格后再完成付款。</p>
  <h2>2. 虚拟币</h2>
  <p>微撩币仅可用于应用内已明示的服务，不具有现金价值，不得转让、兑现或用于应用外交易。</p>
  <h2>3. 异常处理</h2>
  <p>如遇到扣款后未到账、重复扣款或商品无法购买，请先保留 Apple 订单信息，并通过应用内客服反馈。退款由 Apple 依其政策处理。</p>
  <h2>4. 未成年人</h2>
  <p>本应用仅面向年满 18 周岁的用户。</p>
