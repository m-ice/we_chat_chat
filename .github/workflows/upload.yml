name: Flutter CI & Distribute

on:
  push:
    branches:
      - '**'
    tags:
      - '*'

  workflow_dispatch:
    inputs:
      distribute:
        description: '是否执行分发'
        required: true
        default: true
        type: boolean

jobs:
  # =========================================================
  # Android
  # =========================================================
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          flutter pub get

      # =====================================================
      # Android Signing
      # =====================================================
      - name: Setup Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          mkdir -p configs

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode \
            > configs/feige.jks

          cat > android/key.properties <<EOF
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          storeFile=../../configs/feige.jks
          storePassword=$ANDROID_STORE_PASSWORD
          EOF

          echo "Android signing configured."

      # =====================================================
      # Analyze
      # =====================================================
      - name: Run flutter analyze
        run: |
          flutter analyze || echo "Analyze finished with warnings/errors"

      # =====================================================
      # Build APK
      # =====================================================
      - name: Build release APK
        run: |
          flutter build apk --release
          ls -lh build/app/outputs/flutter-apk/

      # =====================================================
      # Build AAB
      # =====================================================
      - name: Build release AAB
        run: |
          flutter build appbundle --release
          ls -lh build/app/outputs/bundle/release/

      # =====================================================
      # Verify APK
      # =====================================================
      - name: Verify APK signature
        run: |
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)

          "$BUILD_TOOLS_DIR/apksigner" \
            verify \
            --verbose \
            --print-certs \
            build/app/outputs/flutter-apk/app-release.apk

      # =====================================================
      # Upload artifacts
      # =====================================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab

      # =====================================================
      # Pgyer
      # 只有手动触发 + distribute=true 才执行
      # =====================================================
      - name: Upload to Pgyer
        id: upload_pgyer
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.distribute == true }}
        shell: bash
        env:
          PGY_API_KEY: ${{ secrets.PGY_API_KEY }}
        run: |
          set -euo pipefail

          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found: $APK_PATH"
            exit 1
          fi

          echo "Requesting Pgyer upload token..."

          TOKEN_RESPONSE=$(curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            -X POST \
            -F "_api_key=$PGY_API_KEY" \
            -F "buildType=android" \
            https://www.pgyer.com/apiv2/app/getCOSToken)

          echo "Token response:"
          echo "$TOKEN_RESPONSE"

          if ! echo "$TOKEN_RESPONSE" | jq -e . >/dev/null 2>&1; then
            echo "Pgyer token response is not valid JSON."
            exit 1
          fi

          CODE=$(echo "$TOKEN_RESPONSE" | jq -r '.code')

          if [ "$CODE" != "0" ]; then
            echo "Failed to get Pgyer upload token."
            exit 1
          fi

          ENDPOINT=$(echo "$TOKEN_RESPONSE" | jq -r '.data.endpoint')
          BUILD_KEY=$(echo "$TOKEN_RESPONSE" | jq -r '.data.key')

          PARAM_KEY=$(echo "$TOKEN_RESPONSE" | jq -r '.data.params.key')
          PARAM_SIGNATURE=$(echo "$TOKEN_RESPONSE" | jq -r '.data.params.signature')
          PARAM_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.data.params["x-cos-security-token"]')

          echo "Uploading APK..."

          curl \
            --fail \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            -F "key=$PARAM_KEY" \
            -F "signature=$PARAM_SIGNATURE" \
            -F "x-cos-security-token=$PARAM_TOKEN" \
            -F "file=@$APK_PATH" \
            "$ENDPOINT"

          echo
          echo "Waiting for Pgyer processing..."

          SUCCESS=false

          for i in {1..30}; do
            sleep 5

            INFO_RESPONSE=$(curl \
              --fail \
              --silent \
              --show-error \
              --retry 3 \
              --retry-delay 3 \
              --retry-all-errors \
              -G \
              --data-urlencode "_api_key=$PGY_API_KEY" \
              --data-urlencode "buildKey=$BUILD_KEY" \
              https://www.pgyer.com/apiv2/app/buildInfo)

            if ! echo "$INFO_RESPONSE" | jq -e . >/dev/null 2>&1; then
              echo "Attempt $i: invalid JSON"
              continue
            fi

            CODE=$(echo "$INFO_RESPONSE" | jq -r '.code')

            if [ "$CODE" = "0" ]; then
              SHORTCUT=$(echo "$INFO_RESPONSE" | jq -r '.data.buildShortcutUrl // empty')

              if [ -n "$SHORTCUT" ]; then
                APP_URL="https://www.pgyer.com/$SHORTCUT"

                echo "Pgyer upload success:"
                echo "$APP_URL"

                echo "app_url=$APP_URL" >> "$GITHUB_OUTPUT"

                SUCCESS=true
                break
              fi
            fi

            echo "Attempt $i: still processing..."
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "Pgyer processing timed out."
            exit 1
          fi

      # =====================================================
      # Google Play
      # =====================================================
      - name: Upload to Google Play
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.distribute == true }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}

          # 改成你的真实包名
          packageName: com.xxx.app

          releaseFiles: build/app/outputs/bundle/release/app-release.aab

          track: internal
          status: completed

      # =====================================================
      # Android Email
      # =====================================================
      - name: Send Android notification
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.distribute == true }}
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}

          subject: Android Build Result - ${{ github.ref_name }}

          body: |
            Android build finished.

            Repository:
            ${{ github.repository }}

            Branch / Tag:
            ${{ github.ref_name }}

            Commit:
            ${{ github.sha }}

            Pgyer:
            ${{ steps.upload_pgyer.outputs.app_url }}

            Google Play:
            Track = internal

          to: unaos@qq.com
          from: ${{ secrets.MAIL_USER }}


  # =========================================================
  # iOS
  # =========================================================
  ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      # =====================================================
      # iOS Keychain
      # =====================================================
      - name: Create temporary keychain
        env:
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain \
            -p "$IOS_KEYCHAIN_PASSWORD" \
            build.keychain

          security set-keychain-settings \
            -lut 21600 \
            build.keychain

          security unlock-keychain \
            -p "$IOS_KEYCHAIN_PASSWORD" \
            build.keychain

          security list-keychains \
            -d user \
            -s build.keychain login.keychain-db

      # =====================================================
      # Install P12
      # =====================================================
      - name: Install iOS certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode \
            > certificate.p12

          security import certificate.p12 \
            -k build.keychain \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$IOS_KEYCHAIN_PASSWORD" \
            build.keychain

          security find-identity -v -p codesigning

      # =====================================================
      # Provisioning Profile
      # =====================================================
      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > profile.mobileprovision

          security cms -D -i profile.mobileprovision > profile.plist

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              profile.plist
          )

          echo "Provisioning Profile UUID:"
          echo "$PROFILE_UUID"

          cp profile.mobileprovision \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      # =====================================================
      # Build IPA
      # =====================================================
      - name: Build release IPA
        run: |
          flutter build ipa --release

          echo "IPA output:"
          ls -lh build/ios/ipa/ || true

      # =====================================================
      # Upload artifact
      # =====================================================
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa

      # =====================================================
      # App Store Connect API Key
      # =====================================================
      - name: Setup App Store Connect API Key
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.distribute == true }}
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"

          printf '%s' "$APP_STORE_CONNECT_API_KEY" \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

      # =====================================================
      # Fastlane
      # =====================================================
      - name: Install Fastlane
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.distribute == true }}
        run: sudo gem install fastlane -NV

      # =====================================================
      # Fastlane API JSON
      # =====================================================
      - name: Create App Store Connect API Key JSON
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.distribute == true }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cat > api_key.json <<EOF
          {
            "key_id": "$APP_STORE_CONNECT_API_KEY_ID",
            "issuer_id": "$APP_STORE_CONNECT_ISSUER_ID",
            "key_filepath": "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          }
          EOF

      # =====================================================
      # TestFlight
      # =====================================================
      - name: Upload to TestFlight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.distribute == true }}
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)

          if [ -z "$IPA_PATH" ]; then
            echo "IPA not found."
            exit 1
          fi

          echo "Uploading IPA:"
          echo "$IPA_PATH"

          fastlane pilot upload \
            --ipa "$IPA_PATH" \
            --api_key_path api_key.json \
            --skip_waiting_for_build_processing true

      # =====================================================
      # iOS Email
      # =====================================================
      - name: Send iOS notification
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.distribute == true }}
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}

          subject: iOS Build Result - ${{ github.ref_name }}

          body: |
            iOS build finished.

            Repository:
            ${{ github.repository }}

            Branch / Tag:
            ${{ github.ref_name }}

            Commit:
            ${{ github.sha }}

            TestFlight upload workflow finished.

          to: unaos@qq.com
          from: ${{ secrets.MAIL_USER }}
