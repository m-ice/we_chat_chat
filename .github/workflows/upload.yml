name: Flutter CI & Distribute

on:
  push:
    branches:
      - '**'
    tags:
      - '*'

jobs:
  # =========================================================
  # Android
  # =========================================================
  android:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      # 4. Install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          flutter pub get

      # 5. Setup Android signing
      - name: Setup Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          mkdir -p android/config

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode \
            > android/config/feige.jks

          cat > android/key.properties <<EOF
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          storeFile=../config/feige.jks
          storePassword=$ANDROID_STORE_PASSWORD
          EOF

          echo "Android signing files created."

      # 6. Analyze
      - name: Run flutter analyze
        run: |
          flutter analyze || echo "Analyze finished with warnings/errors"

      # 7. Build APK
      - name: Build release APK
        run: |
          flutter build apk --release
          ls -lh build/app/outputs/flutter-apk/

      # 8. Build AAB
      - name: Build release AAB
        run: |
          flutter build appbundle --release
          ls -lh build/app/outputs/bundle/release/

      # 9. Verify APK signature
      - name: Verify APK signature
        run: |
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)

          "$BUILD_TOOLS_DIR/apksigner" \
            verify \
            --verbose \
            --print-certs \
            build/app/outputs/flutter-apk/app-release.apk

      # 10. Upload APK artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # 11. Upload AAB artifact
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab

      # 12. Upload to Pgyer
      - name: Upload to Pgyer
        id: upload_pgyer
        shell: bash
        env:
          PGY_API_KEY: ${{ secrets.PGY_API_KEY }}
          PGY_USER_KEY: ${{ secrets.PGY_USER_KEY }}
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found: $APK_PATH"
            exit 1
          fi

          echo "Uploading APK to Pgyer..."

          response=$(curl -s \
            -F "file=@$APK_PATH" \
            -F "_api_key=$PGY_API_KEY" \
            -F "uKey=$PGY_USER_KEY" \
            https://www.pgyer.com/apiv2/app/upload)

          echo "Response from Pgyer:"
          echo "$response"

          shortcut=$(echo "$response" | jq -r '.data.buildShortcutUrl // empty')

          if [ -n "$shortcut" ] && [ "$shortcut" != "null" ]; then
            app_url="https://www.pgyer.com/$shortcut"

            echo "APK uploaded successfully:"
            echo "$app_url"

            echo "app_url=$app_url" >> "$GITHUB_OUTPUT"
          else
            echo "Pgyer upload failed."
            echo "app_url=" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # 13. Upload to Google Play
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}

          # 修改成你的真实包名
          packageName: com.xxx.app

          # Google Play 推荐上传 AAB
          releaseFiles: build/app/outputs/bundle/release/app-release.aab

          track: internal
          status: completed

      # 14. Android notification
      - name: Send Android notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 465

          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}

          subject: Android Build Result - ${{ github.ref_name }}

          body: |
            Android build finished.

            Repository:
            ${{ github.repository }}

            Branch / Tag:
            ${{ github.ref_name }}

            Commit:
            ${{ github.sha }}

            Pgyer:
            ${{ steps.upload_pgyer.outputs.app_url }}

            Google Play:
            Track = internal

          # 修改成接收通知的邮箱
          to: unaos@qq.com

          from: ${{ secrets.MAIL_USER }}


  # =========================================================
  # iOS
  # =========================================================
  ios:
    runs-on: macos-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      # 3. Install dependencies
      - name: Install Flutter dependencies
        run: flutter pub get

      # 4. Install CocoaPods
      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      # 5. Create temporary keychain
      - name: Create temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            build.keychain

          security set-keychain-settings \
            -lut 21600 \
            build.keychain

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            build.keychain

          security list-keychains \
            -d user \
            -s build.keychain login.keychain-db

      # 6. Install iOS certificate
      - name: Install iOS certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode \
            > certificate.p12

          security import certificate.p12 \
            -k build.keychain \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            build.keychain

          echo "Installed signing identities:"
          security find-identity -v -p codesigning

      # 7. Install provisioning profile
      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > profile.mobileprovision

          PROFILE_UUID=$(
            security cms -D -i profile.mobileprovision |
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              /dev/stdin
          )

          echo "Provisioning Profile UUID: $PROFILE_UUID"

          cp profile.mobileprovision \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      # 8. Show signing information
      - name: Show signing information
        run: |
          echo "Available signing identities:"
          security find-identity -v -p codesigning

          echo "Installed provisioning profiles:"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles"

      # 9. Build signed IPA
      - name: Build release IPA
        run: |
          flutter build ipa --release

          echo "IPA output:"
          ls -lh build/ios/ipa/ || true

      # 10. Upload IPA artifact
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa

      # 11. Setup App Store Connect API Key
      - name: Setup App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"

          echo "$APP_STORE_CONNECT_API_KEY" \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

      # 12. Install Fastlane
      - name: Install Fastlane
        run: sudo gem install fastlane -NV

      # 13. Upload to TestFlight
      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)

          if [ -z "$IPA_PATH" ]; then
            echo "IPA not found."
            exit 1
          fi

          echo "Uploading:"
          echo "$IPA_PATH"

          fastlane pilot upload \
            --ipa "$IPA_PATH" \
            --api_key_path "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8" \
            --api_key_id "$APP_STORE_CONNECT_API_KEY_ID" \
            --issuer_id "$APP_STORE_CONNECT_ISSUER_ID" \
            --skip_waiting_for_build_processing true

      # 14. iOS notification
      - name: Send iOS notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 465

          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}

          subject: iOS Build Result - ${{ github.ref_name }}

          body: |
            iOS build finished.

            Repository:
            ${{ github.repository }}

            Branch / Tag:
            ${{ github.ref_name }}

            Commit:
            ${{ github.sha }}

            TestFlight upload workflow finished.

          to: unaos@qq.com
          from: ${{ secrets.MAIL_USER }}